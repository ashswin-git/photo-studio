<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Studio – Free Background Remover</title>
<meta name="description" content="Free, private background remover and product photo studio. Runs fully in your browser.">
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e9ecf2;--mut:#9aa3b2;--acc:#7c5cff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
header b{font-size:18px}header span{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:1fr 320px;gap:16px;padding:16px;max-width:1200px;margin:auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:420px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.drop{text-align:center;padding:40px;cursor:pointer;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.drop.hover{outline:2px dashed var(--acc);outline-offset:-12px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn:disabled{opacity:.5;cursor:not-allowed}
canvas#view{max-width:100%;max-height:70vh;display:none;border-radius:8px}
.checker{background:repeating-conic-gradient(#2b2f38 0 25%,#20232b 0 50%) 0 0/20px 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:14px}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:8px;border:2px solid transparent;cursor:pointer}
.sw button.on{border-color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
select,input[type=range]{width:100%}select{background:#11141a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px}
label.t{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.status{position:absolute;inset:0;background:rgba(15,17,21,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:14px}
.bar{width:60%;height:6px;background:#2a2f3a;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
footer{color:var(--mut);font-size:12px;text-align:center;padding:16px}
footer a{color:var(--mut)}
</style>
</head>
<body>
<header><b>✂️ Photo Studio</b><span>Free · Private · Runs in your browser</span></header>
<main>
  <section class="stage checker" id="stage">
    <div class="drop" id="drop">
      <div style="font-size:42px">🖼️</div>
      <div style="font-size:18px;font-weight:600">Drop a photo or tap to upload</div>
      <div style="color:var(--mut);font-size:13px">PNG, JPG or WEBP. Your image never leaves your device.</div>
      <button class="btn" type="button">Upload image</button>
    </div>
    <canvas id="view"></canvas>
    <div class="status" id="status"><div id="stxt">Loading AI model…</div><div class="bar"><i id="sbar"></i></div></div>
    <input type="file" id="file" accept="image/*" hidden>
  </section>
  <aside class="panel">
    <div><h3>Background</h3>
      <div class="sw" id="swatches"></div>
      <div class="row" style="margin-top:8px"><label class="btn ghost" style="text-align:center">Custom image<input type="file" id="bgfile" accept="image/*" hidden></label><input type="color" id="pick" value="#ffd5c2" style="width:48px;height:42px;border:0;background:none"></div>
    </div>
    <div><h3>Size</h3>
      <select id="size">
        <option value="orig">Original</option><option value="1:1">Square 1:1 (Instagram / Amazon)</option>
        <option value="4:5">Portrait 4:5</option><option value="9:16">Story 9:16</option>
        <option value="16:9">Landscape 16:9</option><option value="3:4">Product 3:4</option>
      </select>
    </div>
    <div><h3>Product look</h3>
      <label class="t">Padding <input type="range" id="pad" min="0" max="40" value="8" style="width:55%"></label>
      <label class="t">Shadow <input type="checkbox" id="shadow" checked></label>
      <label class="t">Blur original background <input type="checkbox" id="blur"></label>
    </div>
    <div><h3>Download</h3>
      <div class="row"><button class="btn" id="dlpng" disabled>PNG</button><button class="btn ghost" id="dljpg" disabled>JPG</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ghost" id="reset" disabled>New photo</button><button class="btn ghost" id="compare" disabled>Hold to see original</button></div>
    </div>
  </aside>
</main>
<footer>Open source on <a href="https://github.com/ashswin-git/photo-studio">GitHub</a>. Background removal by <a href="https://github.com/imgly/background-removal-js">IMG.LY background-removal-js</a>.</footer>
<script type="module">
import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm";
const $=id=>document.getElementById(id);
const view=$('view'),ctx=view.getContext('2d');
let orig=null,cut=null,bg={type:'none'},showOrig=false;
const BGS=[{type:'none',css:'repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/10px 10px'},
 {type:'color',v:'#ffffff'},{type:'color',v:'#000000'},{type:'color',v:'#f4f1ea'},{type:'color',v:'#ffe4e1'},{type:'color',v:'#dff3ff'},
 {type:'grad',v:['#ffd1dc','#c3b1ff']},{type:'grad',v:['#a1ffce','#faffd1']},{type:'grad',v:['#f6d365','#fda085']},
 {type:'grad',v:['#e0eafc','#cfdef3']},{type:'grad',v:['#232526','#414345']},{type:'grad',v:['#74ebd5','#acb6e5']}];
const sw=$('swatches');
BGS.forEach((b,i)=>{const e=document.createElement('button');e.title=b.type;
 e.style.background=b.css||(b.type==='color'?b.v:`linear-gradient(135deg,${b.v[0]},${b.v[1]})`);
 e.onclick=()=>{bg=b;mark(e);draw()};if(!i)e.classList.add('on');sw.appendChild(e)});
function mark(e){sw.querySelectorAll('button').forEach(x=>x.classList.remove('on'));e&&e.classList.add('on')}
$('pick').oninput=e=>{bg={type:'color',v:e.target.value};mark();draw()};
$('bgfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;bg={type:'img',v:await loadImg(URL.createObjectURL(f))};mark();draw()};
['size','pad','shadow','blur'].forEach(id=>$(id).oninput=draw);
const drop=$('drop');drop.onclick=()=>$('file').click();
$('file').onchange=e=>e.target.files[0]&&start(e.target.files[0]);
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hover')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hover')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];f&&start(f)});
window.addEventListener('paste',e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));it&&start(it.getAsFile())});
function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
async function start(file){
 orig=await loadImg(URL.createObjectURL(file));
 $('status').style.display='flex';$('stxt').textContent='Loading AI model (first time only)…';$('sbar').style.width='5%';
 try{
  const blob=await removeBackground(file,{progress:(k,c,t)=>{const p=t?Math.round(c/t*100):0;
    $('stxt').textContent=k.startsWith('fetch')?`Downloading AI model… ${p}%`:'Removing background…';$('sbar').style.width=p+'%'},
    output:{format:'image/png'}});
  $('stxt').textContent='Removing background…';
  cut=await loadImg(URL.createObjectURL(blob));
 }catch(err){alert('Background removal failed: '+err.message);$('status').style.display='none';return}
 $('status').style.display='none';drop.style.display='none';view.style.display='block';
 ['dlpng','dljpg','reset','compare'].forEach(i=>$(i).disabled=false);draw();
}
function bbox(img){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);
 const d=x.getImageData(0,0,c.width,c.height).data;let a=c.width,b=c.height,r=0,t=0;
 for(let y=0;y<c.height;y+=2)for(let X=0;X<c.width;X+=2)if(d[(y*c.width+X)*4+3]>20){if(X<a)a=X;if(X>r)r=X;if(y<b)b=y;if(y>t)t=y}
 return r>a?{x:a,y:b,w:r-a+1,h:t-b+1}:{x:0,y:0,w:img.width,h:img.height}}
let box=null;
function draw(){
 if(!cut)return; if(!box||box.src!==cut.src)box={...bbox(cut),src:cut.src};
 if(showOrig){view.width=orig.width;view.height=orig.height;ctx.drawImage(orig,0,0);return}
 const s=$('size').value,pad=+$('pad').value/100;let W,H;
 if(s==='orig'){W=orig.width;H=orig.height}else{const[a,b]=s.split(':').map(Number);const L=Math.max(orig.width,orig.height,1080);if(a>=b){W=L;H=Math.round(L*b/a)}else{H=L;W=Math.round(L*a/b)}}
 view.width=W;view.height=H;ctx.clearRect(0,0,W,H);
 if($('blur').checked){ctx.filter='blur(18px)';cover(orig,W,H);ctx.filter='none'}
 else if(bg.type==='color'){ctx.fillStyle=bg.v;ctx.fillRect(0,0,W,H)}
 else if(bg.type==='grad'){const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,bg.v[0]);g.addColorStop(1,bg.v[1]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 else if(bg.type==='img')cover(bg.v,W,H);
 let dx,dy,dw,dh;
 if(s==='orig'&&pad===0){dx=0;dy=0;dw=W;dh=H;var sx=0,sy=0,sw2=cut.width,sh=cut.height}
 else{sx=box.x;sy=box.y;sw2=box.w;sh=box.h;const k=Math.min(W*(1-2*pad)/sw2,H*(1-2*pad)/sh);dw=sw2*k;dh=sh*k;dx=(W-dw)/2;dy=(H-dh)/2}
 if($('shadow').checked&&bg.type!=='none'){ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=Math.max(W,H)*.03;ctx.shadowOffsetY=Math.max(W,H)*.012;ctx.drawImage(cut,sx,sy,sw2,sh,dx,dy,dw,dh);ctx.restore()}
 ctx.drawImage(cut,sx,sy,sw2,sh,dx,dy,dw,dh);
}
function cover(img,W,H){const k=Math.max(W/img.width,H/img.height),w=img.width*k,h=img.height*k;ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h)}
function dl(type){const jpg=type==='jpg';let c=view;
 if(jpg){c=document.createElement('canvas');c.width=view.width;c.height=view.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(view,0,0)}
 c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='photo-studio.'+(jpg?'jpg':'png');a.click()},jpg?'image/jpeg':'image/png',.92)}
$('dlpng').onclick=()=>dl('png');$('dljpg').onclick=()=>dl('jpg');
$('reset').onclick=()=>{cut=null;orig=null;box=null;view.style.display='none';drop.style.display='flex';$('file').value='';['dlpng','dljpg','reset','compare'].forEach(i=>$(i).disabled=true)};
const cmp=$('compare');['pointerdown'].forEach(e=>cmp.addEventListener(e,()=>{showOrig=true;draw()}));['pointerup','pointerleave'].forEach(e=>cmp.addEventListener(e,()=>{showOrig=false;draw()}));
</script>
</body>
</html>
